[build]
  command = "yarn generate"
  # ssr: false uses static preset → outputs to dist/ (not .output/public)
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Hashed build files never change, so browsers can keep them.
[[headers]]
  for = "/_nuxt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The editor. Without this, "/admin" (no slash) would fall through to the site.
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
