id: S-04
title: How long a seed-stage runway really lasts
iso: 2026-08-06
kind: Monte Carlo
runs: 10,000 runs
relatedModel: M-04
lede: "Ten thousand runs of a single company: monthly burn drawn from the cohort spread, revenue growth lognormal, one bridge round available with probability tied to growth. The question is not the mean. It is the shape of the left tail."
summary: A bridge round thins the left tail and leaves the median almost untouched.
headline:
  value: 13.4 mo
  label: Median runway
rows:
  - k: Starting cash
    v: $1.2M
  - k: Burn, month 1
    v: $68k ± 22k
  - k: Burn growth
    v: 3.5% / mo
  - k: Revenue growth
    v: lognormal μ 8%
  - k: Bridge available
    v: p = f(growth)
stats:
  - k: Median
    v: "13.4"
  - k: P10
    v: "8.1"
  - k: P90
    v: "21.7"
code: |-
  for run in range(10_000):
      cash, burn, rev = 1_200_000, gauss(68_000, 22_000), 0
      for month in range(1, 61):
          rev  *= 1 + lognorm(0.08, 0.05)
          burn *= 1.035
          cash += rev - burn
          if cash <= 0 and not bridged and rand() < p_bridge(rev):
              cash, bridged = cash + 600_000, True
          if cash <= 0:
              runway.append(month); break
finding: I expected the bridge to fatten the middle. It doesn't — it thins the left tail and leaves the median almost untouched, because the companies that qualify for a bridge are the ones that were not going to die. Availability correlates with not needing it.
produced:
  - n: "1"
    label: prediction
    note: Logged privately. The ledger opens January 2027.
  - n: v2
    label: of M-04
    note: Startup financing, revised.
